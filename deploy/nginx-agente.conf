# Nginx do servidor (HTTPS) -> container agente-pu-web em 127.0.0.1:8090
# Ajuste server_name e os caminhos do certificado.

server {
    listen 80;
    server_name agente.grupoflexivel.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name agente.grupoflexivel.com.br;

    ssl_certificate     /etc/nginx/ssl/grupoflexivel.crt;
    ssl_certificate_key /etc/nginx/ssl/grupoflexivel.key;

    # 16m: arquivos de conhecimento (até CONHECIMENTO_MAX_MB=15) e áudios (até AUDIO_MAX_MB=12)
    client_max_body_size 16m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        # opção A (nginx no host): 127.0.0.1:8090
        # opção B (nginx do Dify, mesma rede docker): http://agente-pu-web:8000
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # sobrescreve (não acrescenta) para o IP do registro de acessos não ser forjado
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # streaming das respostas do agente (SSE)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
